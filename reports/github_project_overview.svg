<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16243b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="-30" r="260" fill="#38bdf8" opacity=".08"/>
  <circle cx="120" cy="860" r="220" fill="#6366f1" opacity=".08"/>

  <text x="100" y="105" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="3">END-TO-END MACHINE LEARNING PROJECT</text>
  <text x="100" y="180" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="800">Credit Card Fraud Detection</text>
  <text x="100" y="225" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="26">Find rare, suspicious transactions without drowning analysts in false alarms.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="285" width="1400" height="170" rx="20" fill="#17263d" stroke="#2d4566" stroke-width="2"/>
    <line x1="395" y1="320" x2="395" y2="420" stroke="#2d4566" stroke-width="2"/>
    <line x1="680" y1="320" x2="680" y2="420" stroke="#2d4566" stroke-width="2"/>
    <line x1="965" y1="320" x2="965" y2="420" stroke="#2d4566" stroke-width="2"/>
    <line x1="1245" y1="320" x2="1245" y2="420" stroke="#2d4566" stroke-width="2"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="145" y="340" fill="#38bdf8" font-size="19" font-weight="700">DATA</text>
    <text x="145" y="380" fill="#f8fafc" font-size="27" font-weight="700">284,807</text>
    <text x="145" y="412" fill="#cbd5e1" font-size="19">transactions</text>
    <text x="440" y="340" fill="#f87171" font-size="19" font-weight="700">RARE EVENT</text>
    <text x="440" y="380" fill="#f8fafc" font-size="27" font-weight="700">492 frauds</text>
    <text x="440" y="412" fill="#cbd5e1" font-size="19">0.17% of records</text>
    <text x="725" y="340" fill="#a5b4fc" font-size="19" font-weight="700">MODELS</text>
    <text x="725" y="380" fill="#f8fafc" font-size="27" font-weight="700">3 candidates</text>
    <text x="725" y="412" fill="#cbd5e1" font-size="19">LR · RF · XGBoost</text>
    <text x="1010" y="340" fill="#4ade80" font-size="19" font-weight="700">BEST PR-AUC</text>
    <text x="1010" y="380" fill="#f8fafc" font-size="27" font-weight="700">0.8657</text>
    <text x="1010" y="412" fill="#cbd5e1" font-size="19">XGBoost</text>
    <text x="1290" y="340" fill="#fbbf24" font-size="19" font-weight="700">FOCUS</text>
    <text x="1290" y="380" fill="#f8fafc" font-size="27" font-weight="700">PR-AUC</text>
    <text x="1290" y="412" fill="#cbd5e1" font-size="19">not accuracy alone</text>
  </g>

  <text x="100" y="535" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Explore the interactive dashboard</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="100" y="575" width="215" height="150" rx="16" fill="#1e3653" stroke="#38bdf8" stroke-width="2"/>
    <rect x="335" y="575" width="215" height="150" rx="16" fill="#1e3653" stroke="#38bdf8" stroke-width="2"/>
    <rect x="570" y="575" width="215" height="150" rx="16" fill="#1e3653" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="805" y="575" width="215" height="150" rx="16" fill="#1e3653" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="1040" y="575" width="215" height="150" rx="16" fill="#1e3653" stroke="#4ade80" stroke-width="2"/>
    <rect x="1275" y="575" width="225" height="150" rx="16" fill="#1e3653" stroke="#fbbf24" stroke-width="2"/>
    <text x="125" y="625" fill="#38bdf8" font-size="22" font-weight="800">01 · HOME</text>
    <text x="125" y="665" fill="#f8fafc" font-size="19">Project purpose</text>
    <text x="125" y="695" fill="#cbd5e1" font-size="17">and snapshot</text>
    <text x="360" y="625" fill="#38bdf8" font-size="22" font-weight="800">02 · DATASET</text>
    <text x="360" y="665" fill="#f8fafc" font-size="19">Samples</text>
    <text x="360" y="695" fill="#cbd5e1" font-size="17">and statistics</text>
    <text x="595" y="625" fill="#a5b4fc" font-size="22" font-weight="800">03 · EXPLORE</text>
    <text x="595" y="665" fill="#f8fafc" font-size="19">Compare signals</text>
    <text x="595" y="695" fill="#cbd5e1" font-size="17">between classes</text>
    <text x="830" y="625" fill="#a5b4fc" font-size="22" font-weight="800">04 · MODELS</text>
    <text x="830" y="665" fill="#f8fafc" font-size="19">Curves &amp; metrics</text>
    <text x="830" y="695" fill="#cbd5e1" font-size="17">for model choice</text>
    <text x="1065" y="625" fill="#4ade80" font-size="22" font-weight="800">05 · LIVE CHECK</text>
    <text x="1065" y="665" fill="#f8fafc" font-size="19">Simulate a payment</text>
    <text x="1065" y="695" fill="#cbd5e1" font-size="17">and get a risk score</text>
    <text x="1300" y="625" fill="#fbbf24" font-size="22" font-weight="800">06 · EXPLAIN</text>
    <text x="1300" y="665" fill="#f8fafc" font-size="19">Understand</text>
    <text x="1300" y="695" fill="#cbd5e1" font-size="17">important signals</text>
  </g>

  <rect x="100" y="795" width="1400" height="3" fill="url(#accent)"/>
  <text x="100" y="850" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="22">Python · scikit-learn · XGBoost · SHAP · Streamlit</text>
  <text x="1500" y="850" text-anchor="end" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">github.com</text>
</svg>
